name: SyncerD Git Sync

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - feature/syncerd-bitbucket-test

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync GitHub to Bitbucket
        uses: clouddrove/syncerd@v0.1.1
        with:
          command: git-sync
          config: syncerd.yaml
          once: "true"
          dry-run: "false"
        env:
          SYNCERD_GIT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNCERD_GIT_BITBUCKET_USERNAME: ${{ secrets.BITBUCKET_USERNAME }}
          SYNCERD_GIT_BITBUCKET_PASSWORD: ${{ secrets.BITBUCKET_TOKEN }}