name: SyncerD GitHub to Azure DevOps

on:
  push:
    branches:
      - feature/syncerd-github-to-azure-test

  workflow_dispatch:

permissions:
  contents: read

jobs:
  git-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SyncerD GitHub to Azure DevOps
        uses: clouddrove/syncerd@v0.2.2
        env:
          SYNCERD_GIT_GITHUB_TOKEN: ${{ secrets.SYNCERD_GIT_GITHUB_SOURCE_TOKEN }}
          SYNCERD_GIT_ADO_TOKEN: ${{ secrets.SYNCERD_AZURE_DESTINATION_GIT_PASSWORD }}

        with:
          command: git-sync
          config: syncerd.yaml
          once: "true"
          dry-run: "false"
          report: syncerd-report/github-to-azure.json
          log-format: text

      - name: Show SyncerD report
        if: always()
        run: |
          sudo ls -la syncerd-report || true
          sudo cat syncerd-report/github-to-azure.json || true