name: SyncerD Git Sync

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - feature/syncerd-bitbucket-test

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Bitbucket Authentication
        run: |
          echo "Testing Bitbucket API authentication..."

          response=$(curl -s \
            -o /tmp/bitbucket-response.json \
            -w "%{http_code}" \
            -u "${SYNCERD_GIT_BITBUCKET_EMAIL}:${SYNCERD_GIT_BITBUCKET_TOKEN}" \
            "https://api.bitbucket.org/2.0/user")

          echo "HTTP Status: $response"

          if [ "$response" != "200" ]; then
            echo "Bitbucket authentication failed"
            cat /tmp/bitbucket-response.json
            exit 1
          fi

          echo "Bitbucket authentication successful"

          rm -f /tmp/bitbucket-response.json
        env:
          SYNCERD_GIT_BITBUCKET_EMAIL: ${{ secrets.SYNCERD_GIT_BITBUCKET_EMAIL }}
          SYNCERD_GIT_BITBUCKET_TOKEN: ${{ secrets.SYNCERD_GIT_BITBUCKET_TOKEN }}

      - name: Sync GitHub to Bitbucket
        uses: clouddrove/syncerd@v0.1.1
        with:
          command: git-sync
          config: syncerd.yaml
          once: "true"
          dry-run: "false"
          log-format: "text"
        env:
          SYNCERD_GIT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNCERD_GIT_BITBUCKET_EMAIL: ${{ secrets.SYNCERD_GIT_BITBUCKET_EMAIL }}
          SYNCERD_GIT_BITBUCKET_TOKEN: ${{ secrets.SYNCERD_GIT_BITBUCKET_TOKEN }}