name: SyncerD GitLab to CodeCommit

on:
  push:
    branches:
      - feature/syncerd-codecommit-to-gitlab-test

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  git-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: SyncerD GitLab to CodeCommit
        uses: clouddrove/syncerd@v0.2.2
        env:
          SYNCERD_GIT_GITLAB_TOKEN: ${{ secrets.SYNCERD_GIT_GITLAB_TOKEN }}

          SYNCERD_GIT_CODECOMMIT_DESTINATION_GIT_USERNAME: ${{ secrets.SYNCERD_GIT_CODECOMMIT_DESTINATION_GIT_USERNAME }}
          SYNCERD_GIT_CODECOMMIT_DESTINATION_GIT_PASSWORD: ${{ secrets.SYNCERD_GIT_CODECOMMIT_DESTINATION_GIT_PASSWORD }}

        with:
          command: git-sync
          config: syncerd.yaml
          once: "true"
          dry-run: "false"
          report: syncerd-report/gitlab-to-codecommit.json
          log-format: text

      - name: Show SyncerD report
        if: always()
        run: |
          sudo ls -la syncerd-report || true
          sudo cat syncerd-report/gitlab-to-codecommit.json || true