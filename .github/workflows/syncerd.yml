name: SyncerD Git Sync

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - feature/syncerd-bitbucket-test

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync GitHub to Bitbucket
        uses: clouddrove/syncerd@v0.1.1
        with:
          command: git-sync
          config: syncerd.yaml
          once: "true"
          dry-run: "false"
          report: "sync-report.json"
          log-format: "json"
        env:
          SYNCERD_GIT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNCERD_GIT_BITBUCKET_TOKEN: ${{ secrets.SYNCERD_GIT_BITBUCKET_TOKEN }}

      - name: Show Sync Report
        if: always()
        run: |
          echo "===== SyncerD Report ====="
          if [ -f sync-report.json ]; then
            cat sync-report.json
          else
            echo "sync-report.json was not generated"
          fi

      - name: Upload Sync Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syncerd-report
          path: sync-report.json
          if-no-files-found: ignore