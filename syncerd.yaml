git:
  providers:
    - name: source
      type: azuredevops
      owner: clouddrove-sandbox
      project: testing

    - name: destination
      type: gitlab
      owner: clouddrove-group-tejas

  mirrors:
    - name: azure-to-gitlab
      source: source
      destination: destination

      filters:
        include:
          - "demo-cre-1"

      create_missing: true
      adopt: true

  work_dir: ./syncerd-git-cache
  state_path: ./syncerd-git-cache/git-state.json