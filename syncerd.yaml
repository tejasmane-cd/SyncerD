git:
  providers:
    - name: github
      type: github
      owner: tejasmane-cd

    - name: bitbucket
      type: bitbucket
      owner: tejasmane-syncerd
      email: tejas.mane@clouddrove.com

  mirrors:
    - name: github-to-bitbucket
      source: github
      destination: bitbucket
      filters:
        include:
          - SyncerD
      create_missing: true

  work_dir: ./syncerd-git-cache
  state_path: ./syncerd-git-cache/git-state.json