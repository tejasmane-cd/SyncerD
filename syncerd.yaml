git:
  providers:
    - name: codecommit-source
      type: codecommit
      region: us-east-1

    - name: codecommit-destination
      type: codecommit
      region: us-east-1

  mirrors:
    - name: codecommit-to-codecommit
      source: codecommit-source
      destination: codecommit-destination

      filters:
        include:
          - "SyncerD-GitHub-CodeCommit-Destination"

      name_template: "SyncerD-GitHubActions"

      create_missing: true
      adopt: true

  work_dir: ./syncerd-git-cache
  state_path: ./syncerd-git-cache/git-state.json