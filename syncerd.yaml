git:
  providers:
    - name: github
      type: github
      owner: tejasmane-cd

    - name: ado
      type: azuredevops
      owner: clouddrove-sandbox
      project: testing

  mirrors:
    - name: github-to-azure
      source: github
      destination: ado
      create_missing: true
      adopt: true

  work_dir: ./syncerd-git-cache
  state_path: ./syncerd-git-cache/git-state.json