git:
  providers:
    - name: source
      type: gitlab

    - name: destination
      type: azuredevops
      owner: clouddrove-sandbox
      project: testing

  mirrors:
    - name: gitlab-to-azure
      source: source
      destination: destination

      filters:
        include:
          - "demo-cre-1"

      create_missing: true
      adopt: true

  work_dir: ./syncerd-git-cache
  state_path: ./syncerd-git-cache/git-state.json