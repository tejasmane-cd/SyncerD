git:
  providers:
    - name: codecommit-source
      type: codecommit
      region: us-east-1

    - name: gitlab-destination
      type: gitlab
      owner: clouddrove-group-tejas

  mirrors:
    - name: codecommit-to-gitlab
      source: codecommit-source
      destination: gitlab-destination

      filters:
        include:
          - "SyncerD-GitHub-CodeCommit-Destination"

      name_template: "SyncerD-CodeCommit-GitLab"

      create_missing: true
      visibility: private
      adopt: true

  work_dir: ./syncerd-git-cache
  state_path: ./syncerd-git-cache/git-state.json