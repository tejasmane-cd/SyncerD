git:
  providers:
    - name: source
      type: codecommit
      region: us-east-1

    - name: destination
      type: azuredevops
      owner: clouddrove-sandbox
      project: testing

  mirrors:
    - name: codecommit-to-azure
      source: source
      destination: destination

      repositories:
        - source: "SyncerD-Azure-Source"
          destination: "SyncerD-Azure-Source"

      create_missing: true
      adopt: true

  work_dir: ./syncerd-git-cache
  state_path: ./syncerd-git-cache/git-state.json