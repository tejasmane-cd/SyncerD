git:
  providers:
    - name: source
      type: azuredevops
      owner: clouddrove-sandbox
      project: testing

    - name: destination
      type: github
      owner: tejasmane-cd

  mirrors:
    - name: azure-to-github
      source: source
      destination: destination
      repositories:
        - source: SyncerD-Azure-Source
          destination: SyncerD-GitHub-Destination
      create_missing: true
      adopt: true

  work_dir: ./syncerd-git-cache
  state_path: ./syncerd-git-cache/git-state.json