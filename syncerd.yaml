git:
  providers:
    - name: source
      type: azuredevops
      owner: clouddrove-sandbox
      project: testing

    - name: destination
      type: codecommit
      region: us-east-1

  mirrors:
    - name: azure-to-codecommit
      source: source
      destination: destination

      filters:
        include:
          - "SyncerD-Azure-Source"

      create_missing: true
      adopt: true

  work_dir: ./syncerd-git-cache
  state_path: ./syncerd-git-cache/git-state.json