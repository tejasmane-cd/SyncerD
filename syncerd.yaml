git:
  providers:
    - name: codecommit-source
      type: codecommit
      owner: "924144197303"
      region: us-east-1

    - name: github-destination
      type: github
      owner: tejasmane-cd

  mirrors:
    - name: codecommit-to-github
      source: codecommit-source
      destination: github-destination
      name_template: "SyncerD-CodeCommit-GitHub-Destination"
      filters:
        include:
          - SyncerD-GitHub-CodeCommit-Destination
      create_missing: false
      visibility: private
      push_mode: mirror

  work_dir: ./syncerd-git-cache
  state_path: ./syncerd-git-cache/git-state.json