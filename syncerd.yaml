git:
  providers:
    - name: source
      type: azuredevops
      owner: clouddrove-sandbox
      project: testing

    - name: destination
      type: azuredevops
      owner: clouddrove-sandbox
      project: testing

  mirrors:
    - name: azure-to-azure
      source: source
      destination: destination
      create_missing: true
      adopt: true

  work_dir: ./syncerd-git-cache
  state_path: ./syncerd-git-cache/git-state.json